name: crash report
description: rmcl crashed or panicked
labels: ["crash"]
body:
  - type: textarea
    id: description
    attributes:
      label: what happened
      description: what were you doing when rmcl crashed?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: logs
      description: |
        paste relevant log output here. you can find logs at:

        - **rmcl logs**: `~/.cache/rmcl/` (per-session files like `rmcl_2026-04-20_12-34-56.log`)
        - **launch logs**: `~/.local/share/rmcl/instances/{instance}/.minecraft/logs/launches/`

        you can also view logs in the TUI via the log overlay or use `rmcl log` from the CLI.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: rmcl version
      description: run `rmcl --version` or check the bottom of the TUI.
      placeholder: 0.3.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: additional context
      description: minecraft version, loader, instance setup, anything that might help narrow it down.
    validations:
      required: false
